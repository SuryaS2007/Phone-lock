<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#15231b"><title>Focus Lock</title>
  <link rel="stylesheet" href="./src/styles.css">
  <link rel="stylesheet" href="./src/demo-controls.css">
</head>
<body>
  <div class="sky" aria-hidden="true"><span class="sun"></span><span class="cloud cloud-one"></span><span class="cloud cloud-two"></span></div>
  <div class="ocean" aria-hidden="true"><div class="wave wave-back"></div><div class="wave wave-front"></div></div>
  <main class="timer-shell">
    <header><span class="logo">🦀</span><span>Focus Lock</span><a class="tool-link" href="./servo-test.html">Servo setup</a><span id="connection" class="connection offline"><i></i> Offline</span></header>
    <section class="timer" aria-labelledby="timer-title">
      <div class="crab" aria-hidden="true"><span>⌒</span><b>•&nbsp;&nbsp;•</b></div>
      <p id="timer-title">Time remaining</p>
      <output id="time" aria-live="polite">00:00</output>
      <div class="progress" role="progressbar" aria-label="Study progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
      <p id="status" class="status">Connecting to controller…</p>
      <form id="shell-form">
        <label>Choose a shell</label>
        <div class="shell-picker" role="group" aria-label="Shell selection"><button type="button" data-shell-uid="SHELL1">Shell 1</button><button type="button" data-shell-uid="SHELL2">Shell 2</button></div>
        <label for="shell-uid">Selected shell</label>
        <div class="shell-uid-wrap"><input id="shell-uid" type="text" placeholder="Choose Shell 1 or Shell 2" readonly></div>
        <label for="shell-duration">Time assigned to this shell</label>
        <div class="controls"><div class="input-wrap"><input id="shell-duration" type="number" min="1" max="480" value="25" required><span>minutes</span></div><button id="save-shell" type="submit" disabled>Save shell</button></div>
        <p class="shell-help">Choose a shell, adjust and save its time, rest the pencil on the claw, then lift it to begin.</p>
        <div class="quick-demo"><span>Quick demo:</span><button type="button" data-demo-seconds="10" disabled>10 sec</button><button type="button" data-demo-seconds="20" disabled>20 sec</button><button type="button" data-demo-seconds="30" disabled>30 sec</button></div>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>

      <section class="music" aria-labelledby="music-title">
        <div class="music-heading"><span class="music-icon">♫</span><div><h2 id="music-title">Study soundtrack</h2><p id="track-name">Choose music from your device</p></div></div>
        <div class="music-controls">
          <label class="choose-track" for="music-file">Choose audio</label>
          <input id="music-file" type="file" accept="audio/*">
          <button id="music-toggle" class="music-toggle" type="button" disabled>Play</button>
          <label class="volume-label" for="volume">Volume</label>
          <input id="volume" class="volume" type="range" min="0" max="1" step="0.05" value="0.45">
        </div>
        <audio id="audio" loop></audio>
      </section>
    </section>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
